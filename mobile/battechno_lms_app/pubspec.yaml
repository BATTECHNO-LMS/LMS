name: battechno_lms_app
description: Official BATTECHNO LMS mobile application for universities, field training, and academic learning.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  shared_preferences: ^2.5.3
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  google_fonts: ^6.2.1
  # Phase 25 — mobile push notifications. Disabled by default: no
  # `firebase_options.dart` / native config files ship in this repo, so
  # `PushConfig.isConfigured` stays false and these packages stay inert
  # (see lib/core/push/push_config.dart, docs/PHASE_25_PUSH_NOTIFICATIONS.md).
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/battechno_lms_logo.png
