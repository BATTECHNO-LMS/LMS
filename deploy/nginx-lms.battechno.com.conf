# Host Nginx site for lms.battechno.com (TLS via Certbot).
# Proxies to Docker frontend on 127.0.0.1:8080 (which already proxies /api to backend).
# Keep the 443 server block — copying an HTTP-only file over this site drops HTTPS.

server {
    server_name lms.battechno.com www.lms.battechno.com;
    client_max_body_size 120m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Do not force Connection: upgrade on every request (breaks keep-alive / causes 499s).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lms.battechno.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lms.battechno.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = lms.battechno.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name lms.battechno.com www.lms.battechno.com;
    return 404; # managed by Certbot
}
