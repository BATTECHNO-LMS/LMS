# Legacy product domain. Keep this redirect — do not delete.
# https://lms.battechno.com/* → 301 → https://eprojecto.com/*

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lms.battechno.com www.lms.battechno.com;

    ssl_certificate /etc/letsencrypt/live/lms.battechno.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lms.battechno.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://eprojecto.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name lms.battechno.com www.lms.battechno.com;
    return 301 https://eprojecto.com$request_uri;
}
